# =============================================================================
# Docker Compose – DAST Scanning Environment
# Project : Marketplace FastAPI
# Updated : 2026-06-13
#
# Usage:
#   docker compose -f zap/dast-docker-compose.yml up -d --build
#   docker compose -f zap/dast-docker-compose.yml down -v
# =============================================================================

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_marketplace
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "dast-test-secret-key-minimum-32-bytes-long"
      DATABASE_URL: "postgresql://test_user:test_password@db:5432/test_marketplace"
      APP_ENV: "test"
      CORS_ALLOW_ORIGINS: "http://localhost:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
