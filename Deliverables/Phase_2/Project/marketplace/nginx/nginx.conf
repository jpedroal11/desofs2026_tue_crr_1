# Production reverse proxy for the Marketplace API.
#
# Responsibilities:
#   - Terminate TLS (HTTPS) and redirect all plain HTTP to HTTPS
#   - Send HSTS + hardening response headers
#   - Reverse-proxy to the FastAPI/uvicorn app on the internal Docker network
#
# The app and database are NOT published to the host — only this proxy is.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not leak the nginx version in headers or error pages.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;

    # Reject oversized bodies at the edge. Matches the application's 10 MB
    # image-upload limit so huge payloads never reach the app.
    client_max_body_size 10m;

    # FastAPI app — "app" is the service name on the compose network.
    upstream marketplace_app {
        server app:8000;
    }

    # ── HTTP (port 80): redirect everything to HTTPS ───────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt HTTP-01 challenge passthrough (used in production when
        # issuing/renewing real certificates with certbot).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS (port 443): TLS termination + reverse proxy ──────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern TLS only — no SSLv3/TLSv1.0/TLSv1.1.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Security response headers ──────────────────────────────────────
        # HSTS: force HTTPS for 2 years, cover subdomains, allow preloading.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;
        # JSON API: lock the document down. The application may additionally set
        # a richer CSP via security middleware (separate owner).
        add_header Content-Security-Policy    "default-src 'none'; frame-ancestors 'none'" always;

        location / {
            proxy_pass http://marketplace_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect   off;
        }
    }
}
