# Production reverse proxy for the Marketplace API.
#
# Responsibilities:
#   - Terminate TLS (HTTPS) and redirect all plain HTTP to HTTPS
#   - Send HSTS + hardening response headers
#   - Reverse-proxy to the FastAPI/uvicorn app on the internal Docker network
#
# The app and database are NOT published to the host — only this proxy is.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not leak the nginx version in headers or error pages.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;

    # Reject oversized bodies at the edge. Matches the application's 10 MB
    # image-upload limit so huge payloads never reach the app.
    client_max_body_size 10m;

    # FastAPI app — "app" is the service name on the compose network.
    upstream marketplace_app {
        server app:8000;
    }

    #RATE LIMITING
    # General API traffic: 100 req/min
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Authentication endpoints: 5 req/min
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    limit_req_status 429;

    # Canonical host(s) this proxy serves. CHANGE to your real domain in
    # production (e.g. marketplace.example.com). Requests whose Host header does
    # not match are dropped by the default_server blocks below — this is the
    # allow-list that prevents Host-header injection / cache poisoning.

    # ── Default server: reject requests with an unexpected Host header ──────
    server {
        listen 80  default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        return 444;  # close the connection without a response
    }

    # ── HTTP (port 80): redirect everything to HTTPS ───────────────────────
    server {
        listen 80;
        server_name localhost 127.0.0.1;   # CHANGE to your production domain

        # Let's Encrypt HTTP-01 challenge passthrough (used in production when
        # issuing/renewing real certificates with certbot).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # Redirect to the explicitly configured server_name, NOT the
            # client-supplied Host header — avoids open-redirect via Host
            # injection.
            return 301 https://$server_name$request_uri;
        }
    }

    # ── HTTPS (port 443): TLS termination + reverse proxy ──────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost 127.0.0.1;   # CHANGE to your production domain

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern TLS only — no SSLv3/TLSv1.0/TLSv1.1.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Security response headers ──────────────────────────────────────
        # HSTS: force HTTPS for 2 years, cover subdomains, allow preloading.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;
        # JSON API: lock the document down. The application may additionally set
        # a richer CSP via security middleware (separate owner).
        add_header Content-Security-Policy    "default-src 'none'; frame-ancestors 'none'" always;
        #add_header Content-Security-Policy "frame-ancestors 'none'" always;

        location = /auth/login {
            limit_req zone=auth_limit burst=2 nodelay;

            proxy_pass http://marketplace_app;

            proxy_set_header Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /auth/register {
            limit_req zone=auth_limit burst=2 nodelay;

            proxy_pass http://marketplace_app;

            proxy_set_header Host $server_name;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://marketplace_app;
            # Pass the configured server_name, not the attacker-controllable
            # Host header, to the upstream app.
            proxy_set_header Host              $server_name;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect   off;
        }
    }
}
