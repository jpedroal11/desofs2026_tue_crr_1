# Production stack: nginx (TLS) -> app (uvicorn) -> db (postgres).
#
# Only nginx publishes ports (80/443). The app and database stay on the
# internal "backend" network and are never reachable from the host.
#
# Quick start:
#   1. cp .env.example .env          # then fill in real secrets
#   2. ./nginx/generate-dev-certs.sh # staging certs (or mount real ones)
#   3. docker compose -f docker-compose.prod.yml up --build

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No published ports — DB is only reachable on the internal network.

  app:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: production
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - backend
    # No published ports — only nginx talks to the app.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
