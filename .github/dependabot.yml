version: 2

updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/marketplace"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Ignore patch updates for non-security bumps (optional, remove if you want all updates)
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/Phase_2/Project/marketplace"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"