name: SBOM Generation (CycloneDX)

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: write          # needed for release asset upload

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Create virtual environment & install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r "Deliverables/Phase_2/Project/marketplace/requirements.txt"

      - name: Generate requirements lock file
        run: |
          source .venv/bin/activate
          pip freeze --exclude-editable > requirements-lock.txt

      - name: Install CycloneDX
        run: |
          source .venv/bin/activate
          pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM
        run: |
          source .venv/bin/activate
          cyclonedx-py environment \
            --of JSON \
            -o sbom-cyclonedx.json \
            --output-reproducible \
            .venv

      - name: Install CycloneDX CLI
        run: |
          curl -sSfL \
            https://github.com/CycloneDX/cyclonedx-cli/releases/latest/download/cyclonedx-linux-x64 \
            -o /usr/local/bin/cyclonedx
          chmod +x /usr/local/bin/cyclonedx

      - name: Validate SBOM
        run: cyclonedx validate --input-file sbom-cyclonedx.json --fail-on-errors

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: |
            sbom-cyclonedx.json
            requirements-lock.txt
          retention-days: 90

      - name: Attach SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            sbom-cyclonedx.json
            requirements-lock.txt
