# =============================================================================
# DAST API Scan – OWASP ZAP Active Scan (Manual / Sprint-End)
# =============================================================================
# Runs an authenticated ZAP API scan driven by the FastAPI-generated OpenAPI
# specification.  Unlike the baseline scan this one ACTIVELY injects payloads
# (SQLi, XSS, path-traversal, …) so it should only be run against disposable
# test environments.
#
# Trigger: manual only (workflow_dispatch) – intended for sprint-end testing.
#
# Related files:
#   - Deliverables/Phase_2/Project/marketplace/zap/zap-api-rules.conf
#   - Deliverables/Phase_2/Project/marketplace/zap/zap-auth-script.py
#   - Deliverables/Phase_2/Project/marketplace/zap/validate-dast-results.py
# =============================================================================

name: "DAST – ZAP API Scan"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-api-scan:
    name: ZAP API + Active Scan
    runs-on: ubuntu-latest

    # ── Postgres service container ──────────────────────────────────────
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_marketplace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── 2. Set up Python (needed for auth + validation scripts) ───────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Build the application Docker image ─────────────────────────
      - name: Build application Docker image
        run: |
          docker build \
            -t marketplace-dast:latest \
            Deliverables/Phase_2/Project/marketplace/

      # ── 4. Start the application container ────────────────────────────
      - name: Start application container
        run: |
          docker run -d \
            --name marketplace-app \
            --network host \
            -e SECRET_KEY="dast-test-secret-key-minimum-32-bytes-long" \
            -e DATABASE_URL="postgresql://test_user:test_password@localhost:5432/test_marketplace" \
            -e APP_ENV="test" \
            -e CORS_ALLOW_ORIGINS="http://localhost:8000" \
            marketplace-dast:latest

      # ── 5. Wait for the app to become healthy ─────────────────────────
      - name: Wait for application health check
        run: |
          echo "Waiting for application to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null 2>&1; then
              echo "✅ Application is healthy (attempt ${i}/30)"
              exit 0
            fi
            echo "  Attempt ${i}/30 – not ready yet, retrying in 2 s..."
            sleep 2
          done
          echo "❌ Application failed to start within 60 seconds"
          docker logs marketplace-app
          exit 1

      # ── 6. Install Python HTTP client for auth script ─────────────────
      - name: Install httpx
        run: pip install httpx

      # ── 7. Run authentication & token-tampering script (DAST-05) ──────
      # The script:
      #   a) Registers a test user and obtains a valid JWT
      #   b) Performs token-tampering tests (expired, wrong-sig, alg:none)
      #   c) Writes the valid token to  ./zap-auth-token.txt
      #   d) Writes DAST-05 results to  ./dast-05-results.json
      - name: Run auth & token-tampering script
        id: auth
        run: |
          python Deliverables/Phase_2/Project/marketplace/zap/zap-auth-script.py \
            --url http://localhost:8000

          # Export the token so subsequent steps can use it
          TOKEN=$(cat zap-auth-token.txt)
          echo "ZAP_AUTH_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          echo "::add-mask::${TOKEN}"

      # ── 8. Run OWASP ZAP API Scan ────────────────────────────────────
      # The OpenAPI spec is auto-generated by FastAPI at /openapi.json
      # when APP_ENV != production.
      #
      # Auth is injected via ZAP's Replacer add-on: every outgoing request
      # gets an "Authorization: Bearer <token>" header added automatically.
      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: "http://localhost:8000/openapi.json"
          format: openapi
          rules_file_name: "Deliverables/Phase_2/Project/marketplace/zap/zap-api-rules.conf"
          cmd_options: >-
            -a -j
            -z "-config replacer.full_list(0).description=auth_header
                -config replacer.full_list(0).enabled=true
                -config replacer.full_list(0).matchtype=REQ_HEADER
                -config replacer.full_list(0).matchstr=Authorization
                -config replacer.full_list(0).replacement=Bearer\ ${{ env.ZAP_AUTH_TOKEN }}"
          allow_issue_writing: false
          fail_action: "warn"

      # ── 9. Validate DAST results with custom script ───────────────────
      - name: Validate DAST results
        if: always()
        run: |
          # Find the ZAP JSON report (the action writes to the workspace)
          REPORT=$(find . /zap/wrk/ -maxdepth 1 -name '*.json' -not -name 'dast-*' 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then
            python Deliverables/Phase_2/Project/marketplace/zap/validate-dast-results.py \
              --mode api \
              --report "$REPORT" \
              --url http://localhost:8000
          else
            echo "⚠️  No ZAP JSON report found — skipping validation"
          fi

      # ── 10. Upload ZAP reports ────────────────────────────────────────
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-api-scan-report
          path: |
            /zap/wrk/
            dast-results-summary.json
          retention-days: 30

      # ── 11. Upload DAST-05 auth test results ──────────────────────────
      - name: Upload DAST-05 auth test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-05-auth-test-results
          path: dast-05-results.json
          retention-days: 30

      # ── 12. Cleanup containers ────────────────────────────────────────
      - name: Cleanup containers
        if: always()
        run: |
          docker stop marketplace-app 2>/dev/null || true
          docker rm marketplace-app 2>/dev/null || true
