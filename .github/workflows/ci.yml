name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Phase_2/Project/marketplace

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Phase_2/Project/marketplace/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest-cov

      - name: Run tests with coverage
        env:
          SECRET_KEY: "ci-secret-key-do-not-use-in-prod-min-32-bytes"
          DATABASE_URL: "sqlite:///:memory:"
          APP_ENV: "test"
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Phase_2/Project/marketplace/coverage.xml
          retention-days: 14
